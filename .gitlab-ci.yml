stages:
  - validate
  - test
  - build
  - release
  - publish

variables:
  GO_VERSION: "1.25"
  TERRAFORM_PROVIDER_NAME: "runzero"

# Cache Go modules across jobs
.go-cache: &go-cache
  cache:
    key: go-mod-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push

# ──────────────────────────────────────────────
# Stage: validate
# ──────────────────────────────────────────────

lint:
  stage: validate
  image: golangci/golangci-lint:latest
  <<: *go-cache
  script:
    - golangci-lint run ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

fmt-check:
  stage: validate
  image: golang:${GO_VERSION}
  script:
    - test -z "$(gofmt -l .)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ──────────────────────────────────────────────
# Stage: test
# ──────────────────────────────────────────────

unit-test:
  stage: test
  image: golang:${GO_VERSION}
  <<: *go-cache
  script:
    - go mod tidy
    - go test ./... -v -race -coverprofile=coverage.out
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build-check:
  stage: test
  image: golang:${GO_VERSION}
  <<: *go-cache
  script:
    - go mod tidy
    - go build ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ──────────────────────────────────────────────
# Stage: build (only on tags)
# ──────────────────────────────────────────────

goreleaser:
  stage: build
  image: goreleaser/goreleaser:latest
  <<: *go-cache
  variables:
    GIT_DEPTH: 0
  before_script:
    - echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
  script:
    - goreleaser release --clean --config .goreleaser.gitlab.yml
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ──────────────────────────────────────────────
# Stage: release (GitLab release from tag)
# ──────────────────────────────────────────────

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: goreleaser
      artifacts: true
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Terraform Provider RunZero $CI_COMMIT_TAG"
    assets:
      links:
        - name: "SHA256SUMS"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${TERRAFORM_PROVIDER_NAME}/${CI_COMMIT_TAG}/terraform-provider-${TERRAFORM_PROVIDER_NAME}_${CI_COMMIT_TAG#v}_SHA256SUMS"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ──────────────────────────────────────────────
# Stage: publish (upload to GitLab Terraform Provider Registry)
# ──────────────────────────────────────────────

publish-provider:
  stage: publish
  image: curlimages/curl:latest
  needs:
    - job: goreleaser
      artifacts: true
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing terraform-provider-${TERRAFORM_PROVIDER_NAME} v${VERSION}"

      # Upload each platform zip to GitLab's generic package registry
      for archive in dist/terraform-provider-${TERRAFORM_PROVIDER_NAME}_${VERSION}_*.zip; do
        filename=$(basename "$archive")
        echo "Uploading ${filename}..."
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${archive}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${TERRAFORM_PROVIDER_NAME}/${CI_COMMIT_TAG}/${filename}"
      done

      # Upload checksums
      echo "Uploading SHA256SUMS..."
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/terraform-provider-${TERRAFORM_PROVIDER_NAME}_${VERSION}_SHA256SUMS" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${TERRAFORM_PROVIDER_NAME}/${CI_COMMIT_TAG}/terraform-provider-${TERRAFORM_PROVIDER_NAME}_${VERSION}_SHA256SUMS"

      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/terraform-provider-${TERRAFORM_PROVIDER_NAME}_${VERSION}_SHA256SUMS.sig" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${TERRAFORM_PROVIDER_NAME}/${CI_COMMIT_TAG}/terraform-provider-${TERRAFORM_PROVIDER_NAME}_${VERSION}_SHA256SUMS.sig"

      # Upload the Terraform registry manifest (protocol versions); GoReleaser does not copy it into dist/
      echo "Uploading manifest..."
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "terraform-registry-manifest.json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${TERRAFORM_PROVIDER_NAME}/${CI_COMMIT_TAG}/terraform-provider-${TERRAFORM_PROVIDER_NAME}_${VERSION}_manifest.json"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
