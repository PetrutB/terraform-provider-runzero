name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The mocktest package drives the provider through the Terraform CLI.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./... -v -race -coverprofile=coverage.out
      - name: Coverage
        run: go tool cover -func=coverage.out
